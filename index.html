<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4f5fb;
  --display:'Unbounded','Segoe UI',system-ui,sans-serif;
  --silver:linear-gradient(180deg,#ffffff 10%,#e3e6f2 55%,#b9bfd3 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:var(--display)}

/* ---------- Video backgrounds ---------- */
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 3s ease;z-index:1}
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.4) 0%,rgba(0,0,0,.78) 100%)}
body.p1 #v1,body.p2 #v2{opacity:1}

/* ---------- Pages ---------- */
.page{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vmin;
  opacity:0;visibility:hidden;filter:blur(14px);transition:opacity 1.8s ease,filter 1.8s ease,visibility 1.8s}
body.p1 #page1,body.p2 #page2{opacity:1;visibility:visible;filter:blur(0)}

/* Page 1 */
#page1{padding-bottom:16vh}
.hello{position:relative;top:clamp(.5rem,2vw,1.8rem);font-weight:300;font-size:clamp(1.1rem,3.2vw,2.6rem);letter-spacing:.04em;color:rgba(244,245,251,.92);
  text-shadow:0 2px 30px rgba(0,0,0,.6);opacity:0;animation:rise 2.4s .6s cubic-bezier(.2,.7,.2,1) forwards}
.name-wrap{position:relative;height:1.3em;margin-top:.5em;font-weight:700;
  font-size:clamp(2.3rem,9.4vw,8.6rem);line-height:1.3;width:100%;
  filter:drop-shadow(0 0 26px rgba(255,255,255,.28)) drop-shadow(0 4px 30px rgba(0,0,0,.6))}
.name{position:absolute;left:0;right:0;top:0;white-space:nowrap;opacity:0;filter:blur(18px);transform:scale(.96);
  transition:opacity 1.4s ease,filter 1.4s ease,transform 1.8s ease;
  background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .05em}
.name.on{opacity:1;filter:blur(0);transform:scale(1)}
.name.long{font-size:.78em}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

/* Page 2 */
.wish{font-weight:500;font-size:clamp(1.6rem,5vw,4.2rem);line-height:1.3;max-width:60rem;
  background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,255,255,.28)) drop-shadow(0 4px 30px rgba(0,0,0,.6));
  opacity:0;transform:translateY(16px);transition:opacity 2.4s 1.6s ease,transform 2.4s 1.6s cubic-bezier(.2,.7,.2,1)}
body.p2 .wish{opacity:1;transform:none}
</style>
</head>
<body class="p1">

<video id="v1" src="Rust.mp4" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
<video id="v2" src="Rust2.mp4" muted loop playsinline preload="auto" aria-hidden="true"></video>
<div class="shade"></div>

<main id="page1" class="page">
  <p class="hello">С днём рождения,</p>
  <div class="name-wrap" id="names" aria-live="polite"></div>
</main>

<section id="page2" class="page">
  <p class="wish">Желаю счастья и хороших друзей ;)</p>
</section>

<script>
(function(){
  var NAMES=["Максим","AHOTIK","Tanjer","Coud-Ism"];
  var body=document.body,v1=document.getElementById('v1'),v2=document.getElementById('v2'),wrap=document.getElementById('names');
  var STEP=3200,START=1600;

  var els=NAMES.map(function(n){
    var s=document.createElement('span');s.className='name'+(n.length>7?' long':'');s.textContent=n;wrap.appendChild(s);return s;
  });
  function show(k){els.forEach(function(e,j){e.classList.toggle('on',j===k)});}

  function play(v){try{var p=v.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  play(v1);
  // if autoplay is blocked, start on first interaction
  addEventListener('pointerdown',function(){play(v1);if(body.classList.contains('p2'))play(v2);},{once:true});

  NAMES.forEach(function(_,k){setTimeout(function(){show(k)},START+k*STEP);});

  // after the last name has been shown, go to page 2
  setTimeout(function(){
    body.classList.remove('p1');body.classList.add('p2');
    v2.currentTime=0;play(v2);
    setTimeout(function(){v1.pause();},3200);
  },START+NAMES.length*STEP+300);
})();
</script>
</body>
</html>
